<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141238" />
  <title>生日快乐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="stars"></canvas>

  <button id="music-toggle" class="music-toggle" hidden title="音乐">
    <span id="music-icon">🔊</span>
  </button>

  <div id="toast" class="toast"></div>

  <!-- 开场：礼物盒 -->
  <section id="stage-intro" class="stage">
    <div class="intro-inner">
      <p class="intro-hint">有一份礼物，只为你准备</p>
      <div class="gift" id="gift">
        <div class="gift-bow"></div>
        <div class="gift-lid"></div>
        <div class="gift-box">
          <div class="gift-ribbon"></div>
        </div>
      </div>
      <button id="open-btn" class="open-btn">🎁 点击打开礼物</button>
      <p class="intro-tip">建议开启声音 · 调亮屏幕</p>
    </div>
  </section>

  <!-- 主内容 -->
  <section id="stage-main" class="stage hidden">
    <div class="content">
      <div class="cake-wrap" id="cake-wrap">
        <div class="cake">
          <div class="candles">
            <div class="candle"><span class="flame"></span></div>
            <div class="candle"><span class="flame"></span></div>
            <div class="candle"><span class="flame"></span></div>
          </div>
          <div class="cake-top"></div>
          <div class="cake-mid"></div>
          <div class="cake-bottom"></div>
        </div>
      </div>

      <h1 class="title" id="title">生日快乐</h1>
      <p class="subtitle" id="subtitle"></p>

      <div class="cards">
        <div class="card">
          <div class="card-num"><span id="days-num">0</span></div>
          <div class="card-label">我们认识的天数</div>
        </div>
        <div class="card">
          <div class="card-num"><span id="visits-num">0</span></div>
          <div class="card-label">为你点亮的次数</div>
        </div>
      </div>

      <div class="letter" id="letter">
        <div class="letter-text" id="letter-text"></div>
      </div>

      <button id="blow-btn" class="blow-btn hidden">🕯️ 点这里吹蜡烛 · 许个愿</button>
    </div>
  </section>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
